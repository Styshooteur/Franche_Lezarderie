<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezardière de la Confrérie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=6">
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Écran d'accueil -->
  <div id="welcome-screen" class="screen hidden">
    <div class="welcome-panel">
      <h1 class="title">Lezardière de la Confrérie</h1>
      <p class="subtitle">Identifiez-vous pour accéder au réseau</p>
      <form id="welcome-form" class="welcome-form">
        <label for="invite-input" class="field-label">Code d'invitation</label>
        <input
          type="text"
          id="invite-input"
          class="text-input"
          maxlength="64"
          autocomplete="off"
          spellcheck="false"
          placeholder="Code secret de la Confrérie"
        >
        <label for="username-input" class="field-label">Ton identité secrète</label>
        <input
          type="text"
          id="username-input"
          class="text-input"
          maxlength="30"
          autocomplete="off"
          spellcheck="false"
          placeholder="ex: Jean-Pierre d'Artagnan"
        >
        <p class="welcome-note">L'identité choisie est définitive et ne pourra pas être modifiée.</p>
        <p id="welcome-error" class="error-msg hidden"></p>
        <button type="submit" class="btn btn-primary">Entrer en contact</button>
        <p class="test-link"><a href="/test.html">Tester avec plusieurs utilisateurs</a></p>
      </form>
    </div>
  </div>

  <!-- Interface chat -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <h1 class="title title-sm">Lezardière de la Confrérie</h1>
      <div class="header-status">
        <span id="current-user-label" class="status-label current-user"></span>
        <span id="connection-status" class="status-dot connected" title="Connecté"></span>
        <span id="connection-label" class="status-label">En ligne</span>
      </div>
    </header>

    <main id="messages-container" class="messages-container" role="log" aria-live="polite"></main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="message-input"
        class="text-input message-input"
        maxlength="500"
        autocomplete="off"
        spellcheck="false"
        rows="1"
        placeholder="Transmettre un message chiffré..."
      ></textarea>
      <button type="submit" class="btn btn-send btn-icon" aria-label="Envoyer">
        <img src="/img/lizard-send.png" alt="" class="lizard-icon" aria-hidden="true">
      </button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/lizard-messages.js?v=3"></script>
  <script src="/js/app.js?v=6"></script>
</body>
</html>
